name: Refresh Halibuts listings

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out data
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the seven-day feed
        run: node scripts/halibuts_extractor.mjs --days 7 --output data/halibuts-live.json
      - name: Commit changed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/halibuts-live.json
          git diff --cached --quiet || git commit -m "chore(data): refresh Halibuts listings"
          git push
