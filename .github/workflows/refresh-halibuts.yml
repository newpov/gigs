name: Refresh Halibuts listings

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      recheck:
        description: "Re-check already-matched YouTube videos with the stricter rules"
        type: boolean
        default: false
      youtube_limit:
        description: "Maximum YouTube lookups this run"
        default: "25"
      instagram_limit:
        description: "Maximum Instagram profile lookups this run"
        default: "25"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out data
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh today plus the next seven days
        run: node scripts/halibuts_extractor.mjs --days 8 --output data/halibuts-live.json
      - name: Rebuild media assignments
        run: node scripts/enrich_media.mjs --youtube-limit ${{ github.event.inputs.youtube_limit || '25' }} --instagram-limit ${{ github.event.inputs.instagram_limit || '25' }} ${{ github.event.inputs.recheck == 'true' && '--recheck' || '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
      - name: Commit changed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/halibuts-live.json data/artists.json
          git diff --cached --quiet || git commit -m "chore(data): refresh Halibuts listings"
          git push
